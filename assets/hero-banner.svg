<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 70) rotate(90) scale(240 340)">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 290) rotate(90) scale(180 260)">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.8" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#6366F1" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Main Card -->
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="url(#grid)" />
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="url(#orb1)" />
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="url(#orb2)" />

  <!-- Top Status Pill -->
  <rect x="52" y="42" width="295" height="32" rx="16" fill="#1E293B" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <circle cx="72" cy="58" r="5" fill="#10B981">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <text x="88" y="63" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.6">
    AVAILABLE  ·  CTO @ LOLO CAB
  </text>

  <!-- Name & Role -->
  <text x="52" y="132" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.8">
    Ajeet Prajapati
  </text>
  <text x="52" y="172" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
    Chief Technology Officer  ·  SaaS Architect  ·  Full Stack Engineer
  </text>

  <!-- Tagline -->
  <text x="52" y="216" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">
    Designing scalable mobility ecosystems, dynamic pricing engines,
  </text>
  <text x="52" y="239" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">
    real-time telemetry pipelines &amp; production-grade web/mobile SaaS.
  </text>

  <!-- Bottom Tech Pill Row on Left -->
  <rect x="52" y="264" width="84" height="26" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
  <text x="94" y="281" text-anchor="middle" fill="#C7D2FE" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="600">Node.js</text>

  <rect x="146" y="264" width="86" height="26" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
  <text x="189" y="281" text-anchor="middle" fill="#C7D2FE" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="600">MongoDB</text>

  <rect x="242" y="264" width="76" height="26" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
  <text x="280" y="281" text-anchor="middle" fill="#C7D2FE" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="600">React</text>

  <rect x="328" y="264" width="82" height="26" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
  <text x="369" y="281" text-anchor="middle" fill="#C7D2FE" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="600">Flutter</text>

  <rect x="420" y="264" width="112" height="26" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
  <text x="476" y="281" text-anchor="middle" fill="#C7D2FE" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="600">Ubuntu VPS</text>

  <!-- Right Side Code Card -->
  <rect x="690" y="42" width="460" height="246" rx="14" fill="#0B1120" fill-opacity="0.92" stroke="#312E81" stroke-width="1.5"/>
  <!-- Window Dots -->
  <circle cx="714" cy="64" r="5" fill="#EF4444"/>
  <circle cx="732" cy="64" r="5" fill="#F59E0B"/>
  <circle cx="750" cy="64" r="5" fill="#10B981"/>
  <text x="920" y="68" text-anchor="middle" fill="#64748B" font-family="'SFMono-Regular', Consolas, monospace" font-size="12">
    ajeet.config.ts
  </text>
  <line x1="690" y1="84" x2="1150" y2="84" stroke="#1E293B" stroke-width="1"/>

  <text x="712" y="114" fill="#C084FC" font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5">const <tspan fill="#38BDF8">engineer</tspan> <tspan fill="#E2E8F0">=</tspan> <tspan fill="#FBBF24">{</tspan></text>
  <text x="730" y="140" fill="#94A3B8" font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5">role: <tspan fill="#34D399">"CTO @ LOLO CAB"</tspan>,</text>
  <text x="730" y="166" fill="#94A3B8" font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5">prev: <tspan fill="#34D399">"Head of Tech @ Yoketrip"</tspan>,</text>
  <text x="730" y="192" fill="#94A3B8" font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5">core: <tspan fill="#F472B6">["SaaS", "APIs", "Geo", "FinTech"]</tspan>,</text>
  <text x="730" y="218" fill="#94A3B8" font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5">edu:  <tspan fill="#34D399">"B.Sc. CS · Delhi University"</tspan>,</text>
  <text x="730" y="244" fill="#94A3B8" font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5">cert: <tspan fill="#60A5FA">"micro1 AI (Outstanding)"</tspan></text>
  <text x="712" y="270" fill="#FBBF24" font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5">};</text>

  <!-- Bottom Accent Strip -->
  <rect x="2" y="324" width="1196" height="4" rx="2" fill="url(#accentLine)" />
</svg>
