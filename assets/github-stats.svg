<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="588" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="borderLeft" x1="0" y1="0" x2="588" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="borderRight" x1="0" y1="0" x2="588" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.7" />
    </linearGradient>
    <clipPath id="barClip">
      <rect x="646" y="88" width="516" height="14" rx="7" />
    </clipPath>
  </defs>

  <!-- LEFT PANEL: Engineering Impact (Public + Private) -->
  <rect x="2" y="2" width="584" height="256" rx="16" fill="url(#panelGrad)" stroke="url(#borderLeft)" stroke-width="1.5" />

  <text x="32" y="42" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
    GitHub Impact (Public + Private)
  </text>
  <rect x="404" y="24" width="154" height="24" rx="12" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
  <text x="481" y="40" text-anchor="middle" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">
    PRIVATE INCLUDED
  </text>

  <!-- 2x2 Stat Tiles inside Left Panel -->
  <!-- Tile 1: Last Year Contributions -->
  <rect x="32" y="66" width="252" height="76" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <text x="50" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">
    Contributions (Last Year)
  </text>
  <text x="50" y="125" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">
    464
  </text>

  <!-- Tile 2: Total Repositories -->
  <rect x="304" y="66" width="252" height="76" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <text x="322" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">
    Total Repositories
  </text>
  <text x="322" y="125" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">
    49
  </text>
  <text x="366" y="123" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">
    (34 Private · 15 Public)
  </text>

  <!-- Tile 3: Total Contributions -->
  <rect x="32" y="156" width="252" height="76" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <text x="50" y="182" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">
    All-Time Contributions
  </text>
  <text x="50" y="215" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">
    519+
  </text>

  <!-- Tile 4: Longest Streak -->
  <rect x="304" y="156" width="252" height="76" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <text x="322" y="182" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">
    Longest Coding Streak
  </text>
  <text x="322" y="215" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">
    20 Days
  </text>

  <!-- RIGHT PANEL: Top Languages across All 49 Repos -->
  <rect x="614" y="2" width="584" height="256" rx="16" fill="url(#panelGrad)" stroke="url(#borderRight)" stroke-width="1.5" />

  <text x="646" y="42" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
    Top Languages (All 49 Repos)
  </text>
  <text x="646" y="66" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">
    Weighted across private production &amp; public repositories
  </text>

  <!-- Stacked Language Progress Bar (width 516px) -->
  <!-- JS 69.79% = 360px | Dart 17.82% = 92px | TS 9.70% = 50px | Other 2.69% = 14px -->
  <g clip-path="url(#barClip)">
    <rect x="646" y="88" width="360" height="14" fill="#F1E05A" />
    <rect x="1006" y="88" width="92" height="14" fill="#00B4AB" />
    <rect x="1098" y="88" width="50" height="14" fill="#3178C6" />
    <rect x="1148" y="88" width="14" height="14" fill="#A855F7" />
  </g>

  <!-- Legend Column 1 -->
  <circle cx="654" cy="134" r="6" fill="#F1E05A" />
  <text x="670" y="139" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600">
    JavaScript <tspan fill="#94A3B8" font-weight="400">(Node.js / React)</tspan>
  </text>
  <text x="890" y="139" text-anchor="end" fill="#F1E05A" font-family="'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="700">
    69.79%
  </text>

  <circle cx="654" cy="172" r="6" fill="#00B4AB" />
  <text x="670" y="177" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600">
    Dart <tspan fill="#94A3B8" font-weight="400">(Flutter Apps)</tspan>
  </text>
  <text x="890" y="177" text-anchor="end" fill="#00B4AB" font-family="'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="700">
    17.82%
  </text>

  <circle cx="654" cy="210" r="6" fill="#3178C6" />
  <text x="670" y="215" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600">
    TypeScript <tspan fill="#94A3B8" font-weight="400">(SaaS Web)</tspan>
  </text>
  <text x="890" y="215" text-anchor="end" fill="#60A5FA" font-family="'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="700">
    9.70%
  </text>

  <!-- Divider -->
  <line x1="916" y1="124" x2="916" y2="222" stroke="#1E293B" stroke-width="1" />

  <!-- Legend Column 2 -->
  <circle cx="944" cy="134" r="6" fill="#E34C26" />
  <text x="960" y="139" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">HTML5</text>
  <text x="1156" y="139" text-anchor="end" fill="#94A3B8" font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5" font-weight="600">0.86%</text>

  <circle cx="944" cy="172" r="6" fill="#A855F7" />
  <text x="960" y="177" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">CSS3</text>
  <text x="1156" y="177" text-anchor="end" fill="#94A3B8" font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5" font-weight="600">0.63%</text>

  <circle cx="944" cy="210" r="6" fill="#F34B7D" />
  <text x="960" y="215" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">C++ / Others</text>
  <text x="1156" y="215" text-anchor="end" fill="#94A3B8" font-family="'SFMono-Regular', Consolas, monospace" font-size="13.5" font-weight="600">1.20%</text>
</svg>
