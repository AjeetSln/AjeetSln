name: Update GitHub Contribution Stats

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate updated contribution activity SVG
        run: python3 scripts/update_stats.py

      - name: Commit and push updated SVG if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-activity.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(stats): auto-update contribution activity SVG"
            git push
          fi
